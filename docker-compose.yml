name: luphera

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-luphera}
      MYSQL_USER: ${DB_USERNAME:-luphera}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-p${DB_ROOT_PASSWORD:-root}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  meilisearch:
    image: getmeili/meilisearch:v1.15
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:-masterKey}
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: 'true'
    ports:
      - '7700:7700'
    volumes:
      - meilisearch-data:/meili_data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-luphera}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-luphera-secret}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID:-luphera} ${AWS_SECRET_ACCESS_KEY:-luphera-secret} &&
      mc mb --ignore-existing local/${AWS_BUCKET:-luphera} &&
      mc anonymous set download local/${AWS_BUCKET:-luphera} &&
      exit 0
      "

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    working_dir: /var/www/html
    environment: &api-environment
      APP_NAME: Luphéra
      APP_ENV: local
      APP_DEBUG: 'true'
      APP_URL: http://localhost:8000
      APP_KEY: ${APP_KEY:-base64:UcIrfJTkTDYDOTYZ7O8S+Mm8rBEfDeZCPKXR5+W2+O4=}
      APP_LOCALE: fr
      APP_FALLBACK_LOCALE: fr
      FRONTEND_URL: http://localhost:5173
      ADMIN_URL: http://localhost:5174
      SANCTUM_STATEFUL_DOMAINS: localhost:5173,127.0.0.1:5173,localhost:5174,127.0.0.1:5174
      SESSION_DRIVER: redis
      SESSION_DOMAIN: localhost
      SESSION_SECURE_COOKIE: 'false'
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-luphera}
      DB_USERNAME: ${DB_USERNAME:-luphera}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      SCOUT_DRIVER: meilisearch
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: ${MEILISEARCH_KEY:-masterKey}
      FILESYSTEM_DISK: s3
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-luphera}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-luphera-secret}
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: ${AWS_BUCKET:-luphera}
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: 'true'
      AWS_URL: http://localhost:9000/${AWS_BUCKET:-luphera}
      MAIL_MAILER: log
      SEED_ON_START: 'true'
    volumes:
      - ./apps/api:/var/www/html
      - api-vendor:/var/www/html/vendor
    ports:
      - '8000:8000'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
      minio:
        condition: service_healthy
    command: ['php', 'artisan', 'serve', '--host=0.0.0.0', '--port=8000']

  horizon:
    build:
      context: ./apps/api
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      <<: *api-environment
      RUN_MIGRATIONS: 'false'
      SEED_ON_START: 'false'
    volumes:
      - ./apps/api:/var/www/html
      - api-vendor:/var/www/html/vendor
    depends_on:
      api:
        condition: service_started
    command: ['php', 'artisan', 'horizon']

  scheduler:
    build:
      context: ./apps/api
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      <<: *api-environment
      RUN_MIGRATIONS: 'false'
      SEED_ON_START: 'false'
    volumes:
      - ./apps/api:/var/www/html
      - api-vendor:/var/www/html/vendor
    depends_on:
      api:
        condition: service_started
    command: ['php', 'artisan', 'schedule:work']

  web:
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      VITE_API_URL: /api/v1
      VITE_API_PROXY: http://api:8000
    volumes:
      - ./apps/web:/app
      - web-node-modules:/app/node_modules
    ports:
      - '5173:5173'
    depends_on:
      api:
        condition: service_started
    command: ['sh', 'docker/dev-entrypoint.sh']

volumes:
  mysql-data:
  redis-data:
  meilisearch-data:
  minio-data:
  api-vendor:
  web-node-modules:
