name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (PHP 8.3)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, pdo_mysql, gd, zip, bcmath, pcntl, posix
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Run tests
        run: php artisan test

  web:
    name: Web (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        # npm can skip platform-specific optional bindings (npm/cli#4828);
        # the next step installs the Linux binaries explicitly.
        run: npm install --include=optional --no-audit --no-fund

      - name: Ensure native bindings
        # npm skips platform-specific optional bindings on Linux (npm/cli#4828),
        # which breaks Rolldown, Lightning CSS and Tailwind Oxide. Install the
        # Linux x64 binaries explicitly, using the versions pinned in the lockfile.
        run: |
          ROLLDOWN=$(node -p "require('./package-lock.json').packages['node_modules/rolldown'].version")
          LIGHTNING=$(node -p "require('./package-lock.json').packages['node_modules/lightningcss'].version")
          OXIDE=$(node -p "require('./package-lock.json').packages['node_modules/@tailwindcss/oxide'].version")
          npm install --no-save --no-audit --no-fund \
            "@rolldown/binding-linux-x64-gnu@$ROLLDOWN" \
            "lightningcss-linux-x64-gnu@$LIGHTNING" \
            "@tailwindcss/oxide-linux-x64-gnu@$OXIDE"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:run

      - name: Build
        run: npm run build

  compose:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config --quiet

  commit-messages:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check conventional prefixes
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=1
          pattern='^(feat|fix|chore|docs|test|refactor|perf|build|ci|style)(\(.+\))?: .+'
          failed=0
          for sha in $(git rev-list "$base"..HEAD); do
            subject=$(git log -1 --pretty=%s "$sha")
            if ! printf '%s' "$subject" | grep -Eq "$pattern"; then
              echo "Invalid commit message: $subject"
              failed=1
            fi
          done
          exit $failed
